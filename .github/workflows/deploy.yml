name: BackendBuild & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: devsloop-vault-api

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      # ─────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. Prepare metadata
      # ─────────────────────────────────────────
      - name: Prepare image metadata
        id: meta
        run: |
          TAG="${{ github.sha }}"

          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "▶ Image : ${IMAGE_NAME}"
          echo "▶ Tag   : $TAG"

      # ─────────────────────────────────────────
      # 3. Write env file (single source of truth)
      # ─────────────────────────────────────────
      - name: Write env file
        run: |
          cat > /tmp/backend.env << 'EOF'
          NODE_ENV=${{ secrets.NODE_ENV }}
          PORT=3001
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL=${{ secrets.FROM_EMAIL }}
          FROM_NAME=${{ secrets.FROM_NAME }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
          API_URL=${{ secrets.API_URL }}
          CONTACT_RECIPIENT_EMAIL=${{ secrets.CONTACT_RECIPIENT_EMAIL }}
          CACHE_TTL=${{ secrets.CACHE_TTL }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL }}
          PASSWORD_RESET_EXPIRES_HOURS=${{ secrets.PASSWORD_RESET_EXPIRES_HOURS }}
          UPLOAD_DEST=${{ secrets.UPLOAD_DEST }}
          UPLOAD_MAX_SIZE=${{ secrets.UPLOAD_MAX_SIZE }}
          QUEUE_RETRY_LIMIT=${{ secrets.QUEUE_RETRY_LIMIT }}
          QUEUE_RETRY_DELAY=${{ secrets.QUEUE_RETRY_DELAY }}
          QUEUE_EXPIRE_SECONDS=${{ secrets.QUEUE_EXPIRE_SECONDS }}
          JOB_RETRY_LIMIT=${{ secrets.JOB_RETRY_LIMIT }}
          JOB_RETRY_DELAY=${{ secrets.JOB_RETRY_DELAY }}
          JOB_EXPIRE_SECONDS=${{ secrets.JOB_EXPIRE_SECONDS }}
          AUDIT_ARCHIVE_AFTER_DAYS=${{ secrets.AUDIT_ARCHIVE_AFTER_DAYS }}
          AUDIT_DELETE_AFTER_DAYS=${{ secrets.AUDIT_DELETE_AFTER_DAYS }}
          EOF

      # ─────────────────────────────────────────
      # 4. Build Docker image
      # ─────────────────────────────────────────
      - name: Build Docker image
        run: |
          set -euo pipefail

          IMAGE="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"

          DOCKER_BUILDKIT=0 docker build \
            --cache-from "$IMAGE:latest" \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            .

      # ─────────────────────────────────────────
      # 5. Run DB migrations
      # Prisma CLI is a devDep — not in prod image.
      # Use npx to download and run it on-the-fly.
      # ─────────────────────────────────────────
      - name: Run database migrations
        run: |
          set -euo pipefail

          IMAGE="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"

          echo "▶ Running Prisma migrations..."

          docker run --rm \
            --network host \
            --env-file /tmp/backend.env \
            "$IMAGE:$TAG" \
            npx prisma@6 migrate deploy

          echo "✅ Migrations complete"

      # ─────────────────────────────────────────
      # 6. Blue-Green Deploy
      # ─────────────────────────────────────────
      - name: Deploy (Blue-Green)
        run: |
          set -euo pipefail

          IMAGE="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"

          BLUE="backend"
          GREEN="backend_green"

          BLUE_PORT=3001
          GREEN_PORT=3003

          MAX_ATTEMPTS=15
          SLEEP_INTERVAL=2

          # Remove stale green container
          docker stop "$GREEN" || true
          docker rm "$GREEN" || true

          echo "▶ Starting GREEN container..."

          docker run -d \
            --name "$GREEN" \
            -p "$GREEN_PORT:3001" \
            --restart unless-stopped \
            --env-file /tmp/backend.env \
            "$IMAGE:$TAG"

          echo "⏳ Health checking GREEN..."

          READY=false

          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -sf http://localhost:$GREEN_PORT/api/v1/health > /dev/null; then
              echo "Attempt $i/$MAX_ATTEMPTS → OK"
              READY=true
              break
            fi

            echo "Attempt $i/$MAX_ATTEMPTS → not ready"
            sleep "$SLEEP_INTERVAL"
          done

          if [ "$READY" = "false" ]; then
            echo "❌ GREEN failed health check — rolling back"

            docker stop "$GREEN" || true
            docker rm "$GREEN" || true

            exit 1
          fi

          echo "🔀 Swapping containers..."

          docker stop "$BLUE" || true
          docker rm "$BLUE" || true

          docker run -d \
            --name "$BLUE" \
            -p "$BLUE_PORT:3001" \
            --restart unless-stopped \
            --env-file /tmp/backend.env \
            "$IMAGE:$TAG"

          docker stop "$GREEN" || true
          docker rm "$GREEN" || true

          if command -v nginx >/dev/null 2>&1; then
            sudo nginx -s reload
          else
            echo "⚠ nginx not installed, skipping reload"
          fi

          echo "✅ Deployment successful"

      # ─────────────────────────────────────────
      # 7. Cleanup
      # ─────────────────────────────────────────
      - name: Cleanup old images
        if: always()
        run: |
          docker image prune -f

          IMAGE="${{ steps.meta.outputs.image }}"

          docker images "$IMAGE" --format "{{.Repository}}:{{.Tag}} {{.ID}}" \
            | grep -v ":latest" \
            | head -n -5 \
            | awk '{print $2}' \
            | xargs -r docker rmi -f || true

      # ─────────────────────────────────────────
      # 8. Remove env file
      # ─────────────────────────────────────────
      - name: Remove env file
        if: always()
        run: rm -f /tmp/backend.env
