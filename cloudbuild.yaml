steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/devsloop-vault-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/devsloop-vault-api:latest'
      - '.'

  # 2. Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/devsloop-vault-api'

  # 3. Run Database Migrations
  - name: 'gcr.io/$PROJECT_ID/devsloop-vault-api:$COMMIT_SHA'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'npx prisma migrate deploy'
    env:
      - 'DATABASE_URL=${_DATABASE_URL}'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy devsloop-vault-api-service \
          --image=gcr.io/$PROJECT_ID/devsloop-vault-api:$COMMIT_SHA \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --cpu=1 \
          --memory=1Gi \
          --cpu-boost \
          --set-env-vars="NODE_ENV=production,DATABASE_URL=${_DATABASE_URL},JWT_SECRET=${_JWT_SECRET},JWT_EXPIRES_IN=${_JWT_EXPIRES_IN},JWT_REFRESH_SECRET=${_JWT_REFRESH_SECRET},JWT_REFRESH_EXPIRES_IN=${_JWT_REFRESH_EXPIRES_IN},UPLOAD_MAX_SIZE=${_UPLOAD_MAX_SIZE},UPLOAD_DEST=${_UPLOAD_DEST},PASSWORD_RESET_EXPIRES_HOURS=${_PASSWORD_RESET_EXPIRES_HOURS},FRONTEND_URL=${_FRONTEND_URL},LOG_LEVEL=${_LOG_LEVEL},CACHE_TTL=${_CACHE_TTL},QUEUE_RETRY_LIMIT=${_QUEUE_RETRY_LIMIT},QUEUE_RETRY_DELAY=${_QUEUE_RETRY_DELAY},QUEUE_EXPIRE_SECONDS=${_QUEUE_EXPIRE_SECONDS},JOB_RETRY_LIMIT=${_JOB_RETRY_LIMIT},JOB_RETRY_DELAY=${_JOB_RETRY_DELAY},JOB_EXPIRE_SECONDS=${_JOB_EXPIRE_SECONDS},SMTP_HOST=${_SMTP_HOST},SMTP_PORT=${_SMTP_PORT},SMTP_SECURE=${_SMTP_SECURE},SMTP_USER=${_SMTP_USER},SMTP_PASSWORD=${_SMTP_PASSWORD},SMTP_REJECT_UNAUTHORIZED=${_SMTP_REJECT_UNAUTHORIZED},FROM_EMAIL=${_FROM_EMAIL},FROM_NAME=${_FROM_NAME},AUDIT_ARCHIVE_AFTER_DAYS=${_AUDIT_ARCHIVE_AFTER_DAYS},AUDIT_DELETE_AFTER_DAYS=${_AUDIT_DELETE_AFTER_DAYS}"

