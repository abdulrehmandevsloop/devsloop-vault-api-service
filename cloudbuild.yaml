# Backend: one file for both staging and production.
# Environment is chosen by BRANCH_NAME (built-in): branch "dev" = staging, else = production.
#
# STAGING (branch dev):
#   Service: devsloop-vault-api-service-staging
#   Image:   devsloop-vault-api-staging
#   DB:     use staging _DATABASE_URL in trigger
#   Size:   1Gi, 1 CPU, min 0, max 2
#
# PRODUCTION (branch main):
#   Service: devsloop-vault-api-service
#   Image:   devsloop-vault-api
#   DB:     use production _DATABASE_URL in trigger (Cloud SQL socket)
#   Size:   2Gi, 2 CPU, min 1, max 10

steps:
  # Validate environment and required variables
  - name: 'ubuntu'
    id: 'validate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        NODE_ENV=$$([ "$BRANCH_NAME" = "dev" ] && echo "staging" || echo "production")
        [ "$$NODE_ENV" != "staging" ] && [ "$$NODE_ENV" != "production" ] && { echo "ERROR: BRANCH_NAME must be dev (staging) or main (production)"; exit 1; }
        [ -z "${_DATABASE_URL}" ] && { echo "ERROR: _DATABASE_URL is required"; exit 1; }
        [ -z "${_JWT_SECRET}" ] && { echo "ERROR: _JWT_SECRET is required"; exit 1; }
        [ -z "${_JWT_REFRESH_SECRET}" ] && { echo "ERROR: _JWT_REFRESH_SECRET is required"; exit 1; }
        echo "✓ Branch: $BRANCH_NAME -> NODE_ENV: $$NODE_ENV"
        echo "✓ Variables validated"

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    waitFor: ['validate']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        NODE_ENV=$$([ "$BRANCH_NAME" = "dev" ] && echo "staging" || echo "production")
        IMAGE=$$([ "$$NODE_ENV" = "staging" ] && echo "devsloop-vault-api-staging" || echo "devsloop-vault-api")
        docker build -t gcr.io/$PROJECT_ID/$${IMAGE}:$COMMIT_SHA -t gcr.io/$PROJECT_ID/$${IMAGE}:latest .

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    waitFor: ['build']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        NODE_ENV=$$([ "$BRANCH_NAME" = "dev" ] && echo "staging" || echo "production")
        IMAGE=$$([ "$$NODE_ENV" = "staging" ] && echo "devsloop-vault-api-staging" || echo "devsloop-vault-api")
        docker push --all-tags gcr.io/$PROJECT_ID/$${IMAGE}

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    waitFor: ['push']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        NODE_ENV=$$([ "$BRANCH_NAME" = "dev" ] && echo "staging" || echo "production")
        if [ "$$NODE_ENV" = "staging" ]; then
          SERVICE="devsloop-vault-api-service-staging"
          IMAGE="devsloop-vault-api-staging"
          MEMORY="1Gi"; CPU="1"; MAX="2"; MIN="0"
          CLOUDSQL_FLAG=""
        else
          SERVICE="devsloop-vault-api-service"
          IMAGE="devsloop-vault-api"
          MEMORY="2Gi"; CPU="2"; MAX="10"; MIN="1"
          CLOUDSQL_FLAG="--add-cloudsql-instances=devsloop-vault:asia-southeast1:devsloop-vault-production"
        fi

        cat > /tmp/env.yaml << EOF
        NODE_ENV: "$${NODE_ENV}"
        DATABASE_URL: "${_DATABASE_URL}"
        JWT_SECRET: "${_JWT_SECRET}"
        JWT_EXPIRES_IN: "${_JWT_EXPIRES_IN}"
        JWT_REFRESH_SECRET: "${_JWT_REFRESH_SECRET}"
        JWT_REFRESH_EXPIRES_IN: "${_JWT_REFRESH_EXPIRES_IN}"
        SMTP_HOST: "${_SMTP_HOST}"
        SMTP_PORT: "${_SMTP_PORT}"
        SMTP_SECURE: "${_SMTP_SECURE}"
        SMTP_USER: "${_SMTP_USER}"
        SMTP_PASSWORD: "${_SMTP_PASSWORD}"
        SMTP_REJECT_UNAUTHORIZED: "${_SMTP_REJECT_UNAUTHORIZED}"
        FROM_EMAIL: "${_FROM_EMAIL}"
        FROM_NAME: "${_FROM_NAME}"
        FRONTEND_URL: "${_FRONTEND_URL}"
        API_URL: "${_API_URL}"
        LOG_LEVEL: "${_LOG_LEVEL}"
        UPLOAD_MAX_SIZE: "${_UPLOAD_MAX_SIZE}"
        UPLOAD_DEST: "${_UPLOAD_DEST}"
        CACHE_TTL: "${_CACHE_TTL}"
        PASSWORD_RESET_EXPIRES_HOURS: "${_PASSWORD_RESET_EXPIRES_HOURS}"
        QUEUE_RETRY_LIMIT: "${_QUEUE_RETRY_LIMIT}"
        QUEUE_RETRY_DELAY: "${_QUEUE_RETRY_DELAY}"
        QUEUE_EXPIRE_SECONDS: "${_QUEUE_EXPIRE_SECONDS}"
        JOB_RETRY_LIMIT: "${_JOB_RETRY_LIMIT}"
        JOB_RETRY_DELAY: "${_JOB_RETRY_DELAY}"
        JOB_EXPIRE_SECONDS: "${_JOB_EXPIRE_SECONDS}"
        AUDIT_ARCHIVE_AFTER_DAYS: "${_AUDIT_ARCHIVE_AFTER_DAYS}"
        AUDIT_DELETE_AFTER_DAYS: "${_AUDIT_DELETE_AFTER_DAYS}"
        EOF

        gcloud run deploy $${SERVICE} \
          --image=gcr.io/$PROJECT_ID/$${IMAGE}:$COMMIT_SHA \
          --region=asia-southeast1 --platform=managed --allow-unauthenticated \
          --port=8080 --memory=$${MEMORY} --cpu=$${CPU} \
          --max-instances=$${MAX} --min-instances=$${MIN} \
          --cpu-boost \
          --timeout=300 \
          $${CLOUDSQL_FLAG} \
          --env-vars-file=/tmp/env.yaml

# All variables come from the trigger. Set them in Cloud Build trigger (staging + production).
# Required: _DATABASE_URL, _JWT_SECRET, _JWT_REFRESH_SECRET, _FRONTEND_URL, _API_URL,
#   _SMTP_USER, _SMTP_PASSWORD, _FROM_EMAIL. Optional: _JWT_EXPIRES_IN, _LOG_LEVEL, etc.

images: []

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
